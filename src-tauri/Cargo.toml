[package]
name = "floatnote"
version = "0.1.0"
description = "FloatNote - AI-native spatial note-taking application"
authors = ["Renhao Wan <2653990378@qq.com>"]
repository = "https://github.com/renhao-wan/float-note"
homepage = "https://github.com/renhao-wan/float-note"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "floatnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["macos-private-api"] }
tauri-plugin-shell = "2.0"
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
notify = "6.0"
regex = "1.0"
log = "0.4"
env_logger = "0.10"
sha2 = "0.10"
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-fs = "2.0"
thiserror = "1.0"
base64 = "0.21"
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.8"
futures = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
