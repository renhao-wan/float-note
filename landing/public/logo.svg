<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shadowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e40af" flood-opacity="0.4"/>
    </filter>
    <filter id="innerShadow">
      <feOffset dx="0" dy="2"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.2" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- Background shadow layer -->
  <g transform="translate(8, 12)">
    <rect x="80" y="80" width="320" height="280" rx="32" fill="url(#shadowGradient)"/>
  </g>

  <!-- Main window body -->
  <g filter="url(#shadow)">
    <rect x="80" y="80" width="320" height="280" rx="32" fill="url(#mainGradient)"/>

    <!-- Window glass effect -->
    <rect x="80" y="80" width="320" height="280" rx="32" fill="white" opacity="0.08"/>

    <!-- Title bar -->
    <rect x="80" y="80" width="320" height="56" rx="32" fill="white" opacity="0.1"/>
    <rect x="80" y="112" width="320" height="24" fill="white" opacity="0.1"/>

    <!-- Traffic lights -->
    <circle cx="120" cy="108" r="8" fill="#ff5f57"/>
    <circle cx="148" cy="108" r="8" fill="#ffbd2e"/>
    <circle cx="176" cy="108" r="8" fill="#28ca42"/>

    <!-- Content lines -->
    <rect x="120" y="168" width="180" height="12" rx="6" fill="white" opacity="0.9"/>
    <rect x="120" y="200" width="240" height="10" rx="5" fill="white" opacity="0.6"/>
    <rect x="120" y="228" width="200" height="10" rx="5" fill="white" opacity="0.6"/>
    <rect x="120" y="256" width="160" height="10" rx="5" fill="white" opacity="0.4"/>

    <!-- Floating indicator dot -->
    <circle cx="360" cy="320" r="24" fill="white" opacity="0.3"/>
    <circle cx="360" cy="320" r="16" fill="white" opacity="0.5"/>

    <!-- Sparkle/AI indicator -->
    <g transform="translate(340, 100)" opacity="0.9">
      <path d="M12 0L14.5 9.5L24 12L14.5 14.5L12 24L9.5 14.5L0 12L9.5 9.5Z" fill="white"/>
    </g>
  </g>

  <!-- Floating shadow underneath -->
  <ellipse cx="256" cy="400" rx="120" ry="16" fill="#1e40af" opacity="0.2"/>
</svg>
